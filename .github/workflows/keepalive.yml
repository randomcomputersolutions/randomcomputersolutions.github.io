name: Keep Supabase awake

# Pings the Supabase "ping" function on a schedule so the free-tier
# project never sits idle for 7 days and never auto-pauses.

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch: {}       # also lets you run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS "https://vbprmqhpdzlgcrwgbwof.supabase.co/functions/v1/ping" \
            && echo "Ping OK"
